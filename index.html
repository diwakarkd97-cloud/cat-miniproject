<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Cat Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <h1>Random Cat Viewer</h1>
        <p>Discover cute cat, one click at a time.</p>
    </header>

    <div class="app-main">
        <!-- Media display container -->
        <section class="media-container" id="mediaContainer">
            <img src ="https://cataas.com/cat" class="mt-4 img" alt="">
        </section>
        
        <!-- Controls and error handling -->
        <section class="controls">
            <button id="fetchBtn" class="btn-primary">Fetch New Cat</button>
            <p id="errorMessage" class="error-message hidden" aria-live="polite"></p>
        </section>
    </div>

    <script src="./javascript.js"></script>
</body>
</html>
